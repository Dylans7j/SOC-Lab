title: AD Password Spray - Failed Network Logon
id: 3c465dc0-4c63-40a0-a4be-a4a1e563bb21
status: experimental
description: >
  Identifies incorrect-password Windows network logons that can be
  correlated by source address and distinct targeted accounts to
  detect possible password spraying. The five-account threshold is
  implemented separately in the validated Splunk SPL query.
author: Dylan Senez
date: 2026-09-24
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType: 3
    Status: '0xC000006D'
    SubStatus: '0xC000006A'
  condition: selection
falsepositives:
  - Users entering incorrect passwords
  - Stale credentials on multiple endpoints
  - Misconfigured automated authentication
level: low
tags:
  - attack.t1110.003
